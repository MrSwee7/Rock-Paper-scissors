<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel = "stylesheet" href = "style.css">
</head>
<body>
   
    <h1 id = "h1">Rock Paper Scissors</h1>
    <div class = "main">
        <div class="game" id = "paper">
            <img src="./Pictures/paper.png"/>
        </div>
        <div class="game" id = "rock">
            <img src="./Pictures/rock.png"/>
        </div>
        <div class="game" id = "scissors">
            <img src="./Pictures/scissors.png"/>
        </div>
    </div>
    <div class="scoreboard">
        <div class = "YourScore">
            <p id = "userScore">0</p>
            <p>You</p>
        </div>
        <div class = "CompuScore">    
            <p id = "compScore">0</p>
            <p>Comp</p>
        </div>
    </div><br><br><br>
    <p class="msg">Pick your Move</p><br>
    <button class = "mode">Display Mode</button>
        
    <script src = "script.js"></script>
</body>
</html>
